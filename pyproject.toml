[project]
name = "quire"
version = "0.1.0"
description = "Hybrid-retrieval RAG over the Python PEPs, with citations and a measured eval harness"
requires-python = ">=3.11"
dependencies = [
  "bm25s>=0.2",
  "lancedb>=0.13",
  "pyarrow>=15",
  "sentence-transformers>=3.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["quire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 170

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
